# Deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          include-hidden-files: true

      # deploy-pages@v5 hard-caps timeout at 10m and CANCELS the Pages
      # deployment when the queue is slower than that (leaving the site 503).
      # This step creates the deployment and waits longer without cancelling.
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail

          echo "Resolving github-pages artifact for run ${GITHUB_RUN_ID}..."
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' | head -n1)"
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "ERROR: github-pages artifact not found"
            exit 1
          fi
          echo "artifact_id=${ARTIFACT_ID}"

          echo "Requesting OIDC token..."
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=github" | jq -r .value)"
          if [ -z "${OIDC_TOKEN}" ] || [ "${OIDC_TOKEN}" = "null" ]; then
            echo "ERROR: failed to obtain OIDC token"
            exit 1
          fi

          echo "Creating Pages deployment for ${GITHUB_SHA}..."
          jq -n \
            --argjson artifact_id "${ARTIFACT_ID}" \
            --arg pages_build_version "${GITHUB_SHA}" \
            --arg oidc_token "${OIDC_TOKEN}" \
            '{artifact_id:$artifact_id, pages_build_version:$pages_build_version, oidc_token:$oidc_token}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments" --input - >/tmp/pages-deploy.json
          cat /tmp/pages-deploy.json
          BUILD_ID="${GITHUB_SHA}"

          echo "page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"

          echo "Polling Pages deployment (up to 45 minutes). Will NOT auto-cancel."
          DEADLINE=$((SECONDS + 2700))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${BUILD_ID}" --jq .status || true)"
            echo "status=${STATUS}"
            case "${STATUS}" in
              succeed)
                echo "Pages deployment succeeded"
                echo "page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_attempt_error|deployment_lost|deployment_cancelled)
                echo "Pages deployment ended with status=${STATUS}"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "Still queued/in-progress after 45m — leaving deployment running (not cancelling)."
          echo "page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
          exit 0
