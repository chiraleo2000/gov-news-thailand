# Deploy static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Do NOT upload the whole repo: News/Articles Thai paths exceed ~255 UTF-8
      # bytes and Document/ops junk is not part of the public site.
      - name: Stage public Pages tree
        run: |
          set -euo pipefail
          mkdir -p _site
          # Required site surface
          for item in index.html article.html assets data docs js mcp README.md .nojekyll; do
            if [ -e "$item" ]; then
              cp -a "$item" "_site/"
            fi
          done
          # Keep published day packs under data/ only; refuse accidental News/ copy
          if [ -d _site/News ] || [ -d _site/Document ]; then
            echo "ERROR: private trees leaked into _site" >&2
            exit 1
          fi
          # Guard: fail build if any staged path is dangerously long for Pages
          python3 - <<'PY'
          import os
          bad=[]
          for root, dirs, files in os.walk("_site"):
            for name in files:
              rel=os.path.relpath(os.path.join(root,name), "_site").replace("\\","/")
              if len(rel.encode("utf-8")) > 240:
                bad.append((len(rel.encode("utf-8")), rel))
          if bad:
            bad.sort(reverse=True)
            print("ERROR: staged path(s) too long for GitHub Pages:")
            for b,p in bad[:20]:
              print(f"  {b} {p}")
            raise SystemExit(1)
          print("staged path length check ok")
          PY
          du -sh _site
          find _site -type f | wc -l

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
          include-hidden-files: true

      # deploy-pages@v5 hard-caps timeout at 10m and CANCELS the Pages
      # deployment when the queue is slower than that (leaving the site 503).
      # This step creates the deployment and waits longer without cancelling.
      # Prefer upload step artifact_id (avoids Actions API race where the
      # github-pages artifact is not listed yet right after upload).
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
          UPLOAD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail

          resolve_artifact_id() {
            if [ -n "${UPLOAD_ARTIFACT_ID:-}" ] && [ "${UPLOAD_ARTIFACT_ID}" != "null" ]; then
              echo "${UPLOAD_ARTIFACT_ID}"
              return 0
            fi
            local i id=""
            for i in $(seq 1 36); do
              id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name=="github-pages") | .id' | head -n1 || true)"
              if [ -n "${id}" ]; then
                echo "${id}"
                return 0
              fi
              echo "Waiting for github-pages artifact to appear (attempt ${i}/36)..." >&2
              sleep 5
            done
            return 1
          }

          echo "Resolving github-pages artifact for run ${GITHUB_RUN_ID}..."
          ARTIFACT_ID="$(resolve_artifact_id)" || {
            echo "ERROR: github-pages artifact not found after retries"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" || true
            exit 1
          }
          echo "artifact_id=${ARTIFACT_ID}"

          echo "Requesting OIDC token..."
          OIDC_AUDIENCE="https://github.com/${GITHUB_REPOSITORY_OWNER}"
          OIDC_TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(jq -nr --arg a "$OIDC_AUDIENCE" '$a|@uri')" | jq -r .value)"
          if [ -z "${OIDC_TOKEN}" ] || [ "${OIDC_TOKEN}" = "null" ]; then
            echo "ERROR: failed to obtain OIDC token"
            exit 1
          fi

          echo "Creating Pages deployment for ${GITHUB_SHA}..."
          jq -n \
            --argjson artifact_id "${ARTIFACT_ID}" \
            --arg pages_build_version "${GITHUB_SHA}" \
            --arg oidc_token "${OIDC_TOKEN}" \
            '{artifact_id:$artifact_id, pages_build_version:$pages_build_version, oidc_token:$oidc_token}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments" --input - >/tmp/pages-deploy.json
          cat /tmp/pages-deploy.json
          BUILD_ID="${GITHUB_SHA}"

          echo "page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"

          echo "Polling Pages deployment (up to 45 minutes). Will NOT auto-cancel."
          DEADLINE=$((SECONDS + 2700))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${BUILD_ID}" --jq .status || true)"
            echo "status=${STATUS}"
            case "${STATUS}" in
              succeed)
                echo "Pages deployment succeeded"
                echo "page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_attempt_error|deployment_lost|deployment_cancelled)
                echo "Pages deployment ended with status=${STATUS}"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "Still queued/in-progress after 45m - leaving deployment running (not cancelling)."
          echo "page_url=${PAGE_URL}" >> "$GITHUB_OUTPUT"
          exit 0
